---
# Создаёт на чистом Proxmox VE ВМ Ubuntu 22.04 (cloud-init) под стенд.
# Работает через SSH и штатную утилиту qm.
#   ansible-playbook provision-pve.yml
# Идемпотентно: существующие шаблон и ВМ не пересоздаются.

- name: ВМ под стенд на Proxmox
  hosts: pve
  gather_facts: false
  vars:
    vm: "{{ hostvars[groups['docker_hosts'][0]] }}"
    vm_ip: "{{ vm.ansible_host }}"
    img_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
    img_path: /var/lib/vz/template/iso/jammy-server-cloudimg-amd64.img
    pubkey_path: /root/sre-ansible.pub
  tasks:
    - name: Proxmox на месте
      ansible.builtin.command: pveversion
      changed_when: false
      register: pvever

    - name: Версия Proxmox
      ansible.builtin.debug: { msg: "{{ pvever.stdout }}" }

    # ---------- образ и шаблон ----------
    - name: Каталог для образов
      ansible.builtin.file: { path: /var/lib/vz/template/iso, state: directory, mode: "0755" }

    - name: Скачать облачный образ Ubuntu 22.04 (~650 МБ)
      ansible.builtin.get_url:
        url: "{{ img_url }}"
        dest: "{{ img_path }}"
        mode: "0644"
        timeout: 600

    - name: Публичный SSH-ключ управляющей машины → на Proxmox (для cloud-init)
      ansible.builtin.copy:
        src: "{{ ssh_pubkey_file | expanduser }}"
        dest: "{{ pubkey_path }}"
        mode: "0644"

    - name: Есть ли шаблон
      ansible.builtin.command: qm status {{ template_id }}
      register: tmpl
      failed_when: false
      changed_when: false

    - name: Создать шаблон Ubuntu 22.04
      when: tmpl.rc != 0
      ansible.builtin.shell: |
        set -e
        qm create {{ template_id }} --name ubuntu-2204-cloud --ostype l26 \
          --memory 2048 --cores 2 --cpu host \
          --net0 virtio,bridge={{ pve_bridge }} \
          --scsihw virtio-scsi-pci \
          --scsi0 {{ pve_storage }}:0,import-from={{ img_path }},discard=on,ssd=1 \
          --ide2 {{ pve_storage }}:cloudinit \
          --boot order=scsi0 --serial0 socket --vga serial0 --agent enabled=0
        qm template {{ template_id }}

    # ---------- ВМ ----------
    - name: Есть ли ВМ
      ansible.builtin.command: qm status {{ vm_id }}
      register: vmstat
      failed_when: false
      changed_when: false

    - name: "Клонировать и настроить ВМ (cloud-init — пользователь, ключ, статический IP)"
      when: vmstat.rc != 0
      ansible.builtin.shell: |
        set -e
        qm clone {{ template_id }} {{ vm_id }} --name {{ vm_name }} --full 1
        qm set {{ vm_id }} --cores {{ vm_cores }} --memory {{ vm_memory }} --onboot 1 \
          --ciuser {{ vm.ansible_user }} --sshkeys {{ pubkey_path }} \
          --ipconfig0 ip={{ vm_ip }}/{{ vm_prefix }},gw={{ vm_gateway }} \
          --nameserver "{{ vm_dns }}"
        # PVE 8.1+: не делать apt upgrade при первой загрузке (экономит минуты); на старых версиях опции нет
        qm set {{ vm_id }} --ciupgrade 0 || true
        qm resize {{ vm_id }} scsi0 {{ vm_disk_gb }}G

    - name: Запустить ВМ
      ansible.builtin.command: qm start {{ vm_id }}
      register: qmstart
      failed_when: qmstart.rc != 0 and 'already running' not in qmstart.stderr
      changed_when: qmstart.rc == 0

    - name: Дождаться SSH на ВМ (с управляющей машины)
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 300
        search_regex: OpenSSH
      delegate_to: localhost
      become: false

    - name: Итог
      ansible.builtin.debug:
        msg: "ВМ {{ vm_id }} ({{ vm_name }}) готова: ssh {{ vm.ansible_user }}@{{ vm_ip }}"

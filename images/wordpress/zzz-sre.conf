; Переопределения пула php-fpm (файл читается последним)
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; метрики пула для php-fpm_exporter
pm.status_path = /status
ping.path = /ping

; медленные запросы — со стектрейсом в stderr контейнера
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 120s

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      follow_redirects: true
      # Страница должна реально отрендериться WordPress'ом (а не 200 с ошибкой БД)
      fail_if_body_not_matches_regexp: ["wp-(content|includes)"]
